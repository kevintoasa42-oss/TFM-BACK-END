# CI del backend en GitHub Actions: mismas etapas que el Jenkinsfile.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: flashreto-backend

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Imagen Docker
        run: docker build --tag "$IMAGE_NAME:${GITHUB_SHA::7}" .

      - name: Integración con Docker Compose
        run: |
          printf 'POSTGRES_PASSWORD=%s\nPOSTGRES_PORT=5433\nBACKEND_PORT=4000\n' "$(openssl rand -hex 32)" > .env.ci
          docker compose --env-file .env.ci up --build --detach --wait --wait-timeout 180
          FLASHRETO_URL=http://127.0.0.1:4000 npm run test:integration

      - name: Registros de los contenedores
        if: failure()
        run: docker compose --env-file .env.ci logs

      - name: Detener contenedores
        if: always()
        run: docker compose --env-file .env.ci down --volumes --remove-orphans || true

  publish:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Sin credenciales de Docker Hub
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: echo "Define los secretos DOCKERHUB_USERNAME y DOCKERHUB_TOKEN para publicar; se omite la publicación."

      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publicar en Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          repository="$DOCKERHUB_USERNAME/$IMAGE_NAME"
          tags=(--tag "$repository:${GITHUB_SHA::7}")
          # Un reintento de un commit antiguo no debe mover latest hacia atrás.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            tags+=(--tag "$repository:latest")
          else
            echo "main ya avanzó: se publica solo ${GITHUB_SHA::7}, sin mover latest."
          fi
          docker build "${tags[@]}" .
          docker push --all-tags "$repository"
